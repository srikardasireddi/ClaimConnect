# 1. Give this server a name and port
spring.application.name=config-server
server.port=8088

# 2. Point to your GitHub config repo
# !!! IMPORTANT: Replace this URL with your own GitHub repo URL !!!
spring.cloud.config.server.git.uri=https://github.com/srikardasireddi/claimconnect-config.git

# This tells the server to pull the config from GitHub when it starts
spring.cloud.config.server.git.clone-on-start=true

# 3. Register this server with Eureka
# (Assuming your Eureka server is running on localhost:8761)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka