# 1. Give the app a name, so the Config Server knows which file to send
# (This MUST match the name in GitHub: "patientservice")
spring.application.name=patientservice

# 2. Tell the client to find the Config Server using Eureka
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server

# 3. Tell the client where Eureka is (so it can find the Config Server)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka